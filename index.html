<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Myアプリ">
<title>Myアプリ</title>

<!-- ===== PWA アイコン ===== -->
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon.png">
<link rel="apple-touch-icon" sizes="120x120" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>
:root{
  color-scheme:dark;
  --bg:#000;
  --panel:#1c1c1e;
  --panel2:#2c2c2e;
  --panel3:#3a3a3c;
  --text:#f5f5f7;
  --muted:#98989f;
  --accent:#0a84ff;
  --danger:#ff453a;
  --ok:#30d158;
  --menu:#bf5af2;
  --sep:#38383c;
  --sel:#1a293a;
  --side:70px;
  --side-open:min(280px,72vw);
}
*{box-sizing:border-box}
[hidden]{display:none !important}

html{
  margin:0;
  padding:0;
  width:100%;
  height:var(--app-h, 100dvh);
  overflow:hidden;
  background:#000;
  overscroll-behavior:none;
  -webkit-text-size-adjust:100%;
}
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}

button,textarea,input{font:inherit}
button{
  border:0;color:var(--text);background:var(--panel2);
  border-radius:12px;min-height:40px;padding:0 14px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;text-align:center;
}
button.primary{background:var(--accent)}
button.danger{background:var(--danger)}
button.ghost{background:transparent;border:1px solid var(--sep)}
button:active{transform:scale(.97);opacity:.85}
button:disabled{opacity:.4;pointer-events:none}

/* ===== ルート ===== */
.app{
  height:100%;
  width:100%;
  display:flex;
  overflow:hidden;
  padding-left:env(safe-area-inset-left, 0px);
  padding-right:env(safe-area-inset-right, 0px);
}

/* ================= SIDEBAR ================= */
.sidebar{
  flex:0 0 auto;
  width:var(--side);
  background:var(--panel);
  border-right:1px solid #2c2c2e;
  display:flex;flex-direction:column;
  transition:width .22s cubic-bezier(.22,.8,.24,1);
  overflow:hidden;
  position:relative;z-index:20;
  min-height:0;
  height:100%;
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:env(safe-area-inset-bottom, 0px);
}
.sidebar.open{width:var(--side-open)}

.side-scroll{
  flex:1;min-height:0;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding:10px 8px 8px;
  touch-action:pan-y;
}
.side-scroll::-webkit-scrollbar{width:0}
.side-empty{
  padding:22px 10px;color:var(--muted);font-size:12.5px;line-height:1.7;text-align:center;
  display:none;
}
.sidebar.open .side-empty{display:block}

.side-foot{
  flex:0 0 auto;
  padding:8px 8px 8px;
  border-top:1px solid #2c2c2e;
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}
.foot-btn{
  position:relative;
  flex:1;min-width:0;
  min-height:46px;
  border-radius:12px;
  padding:0;
  background:var(--panel2);
  color:var(--muted);
}
.foot-btn:hover{color:var(--text)}
.foot-btn svg{width:20px;height:20px;display:block}

.foot-btn .badge{
  position:absolute;
  top:4px;
  right:4px;
  min-width:18px;
  height:18px;
  padding:0 5px;
  border-radius:9px;
  background:var(--danger);
  color:#fff;
  font-size:11px;
  font-weight:700;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 0 2px var(--panel);
  pointer-events:none;
  z-index:5;
}

.sidebar:not(.open) .side-foot{
  flex-direction:column;
  flex-wrap:nowrap;
  gap:8px;
}
.sidebar:not(.open) .foot-btn{
  flex:0 0 auto;
  width:46px;
  height:46px;
  min-height:46px;
  border-radius:50%;
  margin:0 auto;
}
.sidebar:not(.open) .foot-btn .badge{
  top:0;
  right:0;
  min-width:16px;
  height:16px;
  font-size:10px;
  padding:0 4px;
  border-radius:8px;
}

/* rows */
.srow{
  display:flex;align-items:center;gap:12px;
  padding:12px 12px;min-height:84px;
  border-radius:14px;
  position:relative;z-index:2;
  background:var(--panel);
  touch-action:pan-y;
  transition:transform .24s cubic-bezier(.22,.8,.24,1),background .15s;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  cursor:pointer;
}
.sidebar:not(.open) .srow{
  flex-direction:column;
  justify-content:center;
  padding:6px 2px;
  gap:2px;
  min-height:auto;
}

.row-icon{
  width:56px;height:56px;flex:0 0 auto;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  color:#ffd60a;overflow:hidden;background:transparent;
}
.sidebar:not(.open) .row-icon{width:48px;height:48px;border-radius:12px}
.row-icon svg{width:46px;height:46px;display:block}
.sidebar:not(.open) .row-icon svg{width:34px;height:34px}
.row-icon img{width:100%;height:100%;object-fit:cover;display:block}
.row-icon .ico-letter{
  width:100%;height:100%;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:38px;font-weight:700;color:#fff;line-height:1;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji","Helvetica Neue",sans-serif;
}
.sidebar:not(.open) .row-icon .ico-letter{border-radius:12px;font-size:34px}

.row-icon.folder-icon{
  width:64px;height:64px;border-radius:16px;
}
.row-icon.folder-icon svg{width:54px;height:54px}
.row-icon.folder-icon .ico-emoji{
  font-size:44px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  width:100%;height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji","Helvetica Neue",sans-serif;
}
.sidebar:not(.open) .row-icon.folder-icon{width:52px;height:52px;border-radius:13px}
.sidebar:not(.open) .row-icon.folder-icon svg{width:42px;height:42px}
.sidebar:not(.open) .row-icon.folder-icon .ico-emoji{font-size:38px}

.row-main{flex:1;min-width:0}
.row-title{
  font-size:15px;font-weight:600;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.row-sub{
  font-size:12px;color:var(--muted);line-height:1.3;margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.row-sub2{
  font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  opacity:.85;
}
.row-apps{
  flex:0 0 auto;display:flex;gap:3px;align-items:center;
}
.mini-app{
  width:26px;height:26px;border-radius:8px;overflow:hidden;
  background:var(--panel3);display:flex;align-items:center;justify-content:center;
  flex:0 0 auto;
  font-size:14px;font-weight:700;color:#fff;line-height:1;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji","Helvetica Neue",sans-serif;
}
.mini-app img{width:100%;height:100%;object-fit:cover;display:block}
.row-chev{color:#5a5a5e;flex:0 0 auto;display:flex;align-items:center}
.row-chev svg{width:16px;height:16px;display:block}

.sidebar:not(.open) .row-main{
  width:100%;
  text-align:center;
  flex:0 0 auto;
  min-height:24px;
}
.sidebar:not(.open) .row-title{
  font-size:10px;
  font-weight:500;
  color:var(--muted);
  line-height:1.15;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  white-space:normal;
  word-break:break-all;
  overflow-wrap:anywhere;
  padding:0 2px;
}
.sidebar:not(.open) .row-sub,
.sidebar:not(.open) .row-sub2,
.sidebar:not(.open) .row-apps,
.sidebar:not(.open) .row-chev{display:none}

.sidebar:not(.open) .side-scroll{
  padding:8px 5px 5px;
}
.sidebar:not(.open) .swipe{
  margin-bottom:1px;
}

.srow.selected{background:var(--sel)}
.srow.selected::after{
  content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--accent);
}
.sidebar:not(.open) .srow.selected::after{top:12px;bottom:12px}

/* swipe */
.swipe{
  position:relative;overflow:hidden;background:#000;border-radius:14px;
  margin-bottom:3px;
}
.swipe-actions{
  position:absolute;top:0;right:0;bottom:0;display:flex;z-index:1;
}
.swipe-actions button{
  width:64px;min-height:100%;border-radius:0;padding:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:11px;font-weight:600;color:#fff;background:#48484a;
}
.swipe-actions button:active{transform:none;opacity:.75}
.swipe-actions button svg{width:20px;height:20px}
.swipe-actions .act-edit{background:#0a84ff}
.swipe-actions .act-move{background:#5e5ce6}
.swipe-actions .act-rename{background:#5e5ce6}
.swipe-actions .act-clear{background:#8e8e93}
.swipe-actions .act-del{background:#ff453a}
.sidebar:not(.open) .swipe-actions{display:none}

.swipe.dragging{overflow:visible;z-index:40;transition:none}
.swipe.dragging .srow{
  transition:none;background:var(--panel2);
  box-shadow:0 12px 34px rgba(0,0,0,.7),0 0 0 1px #4a4a4e;
  transform:scale(1.02);
}

@keyframes listFadeIn{
  0%   { opacity:0; transform:translateX(-16px); }
  100% { opacity:1; transform:translateX(0); }
}
@keyframes listFadeInRight{
  0%   { opacity:0; transform:translateX(16px); }
  100% { opacity:1; transform:translateX(0); }
}
.side-list.anim-in{
  animation:listFadeIn .24s cubic-bezier(.22,.8,.24,1) both;
}
.side-list.anim-in-right{
  animation:listFadeInRight .24s cubic-bezier(.22,.8,.24,1) both;
}

.drag-folders{
  position:fixed;top:0;left:0;right:0;z-index:80;
  display:none;gap:8px;flex-wrap:nowrap;align-items:center;
  padding:calc(12px + env(safe-area-inset-top)) 12px 12px;
  background:rgba(28,28,30,.96);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--sep);
  overflow-x:auto;overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
}
.drag-folders.show{display:flex}
.drag-folders::-webkit-scrollbar{height:0}
.chip{
  flex:0 0 auto;height:36px;border-radius:18px;padding:0 16px;
  background:var(--panel3);color:var(--text);
  display:inline-flex;align-items:center;font-size:13.5px;font-weight:600;
  transition:transform .12s,background .12s;
  white-space:nowrap;
}
.chip.current{background:#3a3a3c;color:var(--muted)}
.chip.over{background:var(--accent);color:#fff;transform:scale(1.08)}

.toast{
  position:fixed;left:50%;
  bottom:calc(28px + env(safe-area-inset-bottom));
  transform:translate(-50%,20px);
  background:rgba(60,60,65,.96);color:#fff;padding:9px 16px;border-radius:20px;
  font-size:13px;font-weight:600;z-index:120;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;white-space:nowrap;
  box-shadow:0 6px 24px rgba(0,0,0,.5);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

.swipe-hint{
  position:fixed;
  top:50%;
  left:90px;
  transform:translateY(-50%) translateX(-10px) scale(.85);
  background:var(--accent);
  color:#fff;
  padding:8px 15px;
  border-radius:20px;
  font-size:12.5px;
  font-weight:700;
  letter-spacing:.02em;
  opacity:0;
  pointer-events:none;
  transition:opacity .16s ease, transform .16s cubic-bezier(.22,.8,.24,1), background .16s;
  z-index:60;
  white-space:nowrap;
  box-shadow:0 8px 26px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08);
}
.swipe-hint.show{opacity:1;transform:translateY(-50%) translateX(0) scale(1)}
.swipe-hint.ready{background:var(--ok)}
.swipe-hint.menu-ready{background:var(--menu)}

/* ================= MAIN / PREVIEW ================= */
.main{
  flex:1;min-width:0;display:flex;flex-direction:column;
  min-height:0;
  height:100%;
  background:#000;
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:env(safe-area-inset-bottom, 0px);
}
.toolbar{
  flex:0 0 auto;
  display:flex;align-items:center;gap:8px;
  padding:6px 12px 6px;
}
.dev-btn{
  min-height:36px;border-radius:18px;padding:0 16px;font-size:13px;font-weight:700;
  background:var(--panel2);color:var(--muted);
}
.dev-btn.on{background:var(--accent);color:#fff}
.toolbar .spacer{flex:1}
.tool-btn{
  position:relative;
  width:36px;
  height:36px;
  min-width:36px;
  min-height:36px;
  border-radius:50%;
  padding:0;
  background:var(--panel2);
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.tool-btn svg{width:18px;height:18px}
.tool-btn.has-memo::after{
  content:"";
  position:absolute;
  top:5px;
  right:5px;
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 0 2px var(--panel2);
  pointer-events:none;
}

.stage{
  flex:1;min-height:0;min-width:0;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  padding:4px 8px 6px;
}

.phone{
  position:relative;
  width:300px;height:652px;
  background:#000;
  border:6px solid #202023;
  border-radius:48px;
  overflow:hidden;
  box-shadow:0 14px 40px #000,0 0 0 1px #444;
  flex:0 0 auto;
}
.phone-viewport{
  position:absolute;inset:0;
  overflow:hidden;
  border-radius:42px;
  background:#000;
}
.phone-viewport iframe{
  position:absolute;top:50%;left:50%;
  width:402px;height:874px;border:0;background:#000;color-scheme:dark;
  transform-origin:center center;
  margin-left:-201px;margin-top:-437px;
}
.island{
  position:absolute;z-index:5;top:11px;left:50%;transform:translateX(-50%);
  width:33.5%;
  height:34px;
  background:#000;border-radius:100px;pointer-events:none;
}
.homebar{
  position:absolute;z-index:6;bottom:8px;left:50%;transform:translateX(-50%);
  width:36%;height:4px;border-radius:4px;background:#fff;pointer-events:none;opacity:.9;
}

.ipad{
  position:relative;
  width:600px;height:450px;
  background:#000;
  border:12px solid #2a2a2e;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 14px 40px #000,0 0 0 1px #444;
  flex:0 0 auto;
}
.ipad-viewport{
  position:absolute;inset:0;
  overflow:hidden;
  border-radius:14px;
  background:#000;
}
.ipad-viewport iframe{
  position:absolute;top:50%;left:50%;
  width:1366px;height:1024px;border:0;background:#000;color-scheme:dark;
  transform-origin:center center;
  margin-left:-683px;margin-top:-512px;
}

/* ================= SHEETS ================= */
.editor-overlay{
  position:fixed;
  inset:0;
  z-index:90;background:rgba(0,0,0,.55);
  display:none;align-items:flex-end;justify-content:center;
  overscroll-behavior:none;
}
.editor-overlay.show{display:flex}
.editor-sheet{
  width:100%;max-width:900px;max-height:92%;
  background:var(--bg);border-radius:20px 20px 0 0;
  box-shadow:0 -10px 40px #000;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;overflow:hidden;
}
.editor-scroll{
  flex:1;overflow:auto;min-height:0;padding:14px 14px 0;
}
.editor-search-wrap{
  flex-shrink:0;background:var(--bg);border-top:1px solid var(--sep);
  padding:8px 14px calc(8px + env(safe-area-inset-bottom));
}
.sheet-handle{width:36px;height:5px;border-radius:3px;background:#48484a;margin:0 auto 12px}

.editor-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.editor-actions button{flex:1;min-width:62px;white-space:nowrap;font-size:13px}

.editor-title-row{
  display:flex;align-items:center;gap:8px;margin-bottom:10px;
}
.icon-preview{
  width:46px;height:46px;flex:0 0 auto;border-radius:13px;
  background:#111113;border:1px solid var(--sep);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.icon-preview img{width:100%;height:100%;object-fit:cover;display:block}
.icon-preview .ico-letter{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:700;color:#fff;line-height:1;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji","Helvetica Neue",sans-serif;
}
.icon-preview .ico-none{font-size:19px;color:var(--muted)}

.editor-title-row .name-input{
  flex:1;min-width:80px;height:46px;border:1px solid var(--sep);border-radius:13px;
  background:#111113;color:#fff;padding:0 12px;outline:none;
  -webkit-user-select:text;user-select:text;
}
.editor-title-row .name-input:focus{border-color:var(--accent)}

textarea{
  width:100%;height:min(42vh,360px);resize:vertical;
  background:#111113;color:#f5f5f7;border:1px solid var(--sep);border-radius:14px;
  padding:14px;outline:none;font:13px ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.5;
  white-space:pre-wrap;word-break:break-all;overflow-wrap:anywhere;overflow:auto;
  -webkit-user-select:text;user-select:text;
}
textarea:focus{border-color:var(--accent)}

.search-section{margin-top:0;padding-top:0;border-top:none}
.search-box{display:flex;align-items:center;gap:6px}
.search-field{position:relative;flex:1;min-width:0}
.search-field input{
  width:100%;height:42px;border:1px solid var(--sep);border-radius:12px;
  background:#111113;color:#fff;padding:0 62px 0 11px;outline:none;
  -webkit-user-select:text;user-select:text;
  -webkit-appearance:none;appearance:none;
  caret-color:#f5f5f7;font-size:16px;
}
.search-field input:focus{border-color:var(--accent)}
.search-count{
  position:absolute;right:9px;top:50%;transform:translateY(-50%);
  font-size:11.5px;color:var(--muted);pointer-events:none;white-space:nowrap;
}
.search-box .nav-btn{min-height:42px;min-width:44px;padding:0 8px;font-size:15px}
.search-box #btnSave{min-height:42px;min-width:66px;font-size:14px;font-weight:700}

.picker-sheet{
  width:100%;max-width:520px;max-height:72%;
  background:var(--bg);border-radius:20px 20px 0 0;
  padding:14px 14px calc(14px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:12px;
  box-shadow:0 -10px 40px #000;
}
.picker-sheet h3{margin:0;font-size:16px;font-weight:700;text-align:center}
.picker-list{
  overflow:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;gap:8px;min-height:0;
}
.picker-item{
  display:flex;align-items:center;gap:10px;
  background:var(--panel);border-radius:14px;padding:16px;
  font-size:15px;font-weight:600;cursor:pointer;
  border:1px solid transparent;
}
.picker-item .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
.picker-item.current{border-color:var(--accent);background:#0a84ff18}
.picker-item:active{background:var(--panel2)}

.folder-edit-row{display:flex;gap:8px;align-items:center}
.folder-edit-row .emoji-input{
  width:64px;height:52px;flex:0 0 auto;
  border:1px solid var(--sep);border-radius:13px;
  background:#111113;color:#fff;padding:0;outline:none;
  text-align:center;font-size:26px;line-height:1;
  -webkit-user-select:text;user-select:text;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji","Helvetica Neue",sans-serif;
}
.folder-edit-row .emoji-input:focus{border-color:var(--accent)}
.folder-edit-row .name-input{
  flex:1;min-width:0;height:52px;border:1px solid var(--sep);border-radius:13px;

  width:40px;height:40px;padding:0;border-radius:50%;

}

<body>

<script>
(() => {
  const $ = id => document.getElementById(id);

  const NOTES_KEY        = "pwa-previewer-items-v2";
  const FOLDERS_KEY      = "pwa-previewer-folders-v1";
  const OLD_KEY          = "iphone17pro-pwa-preview-html-v1";
  const LAST_EXPORT_KEY  = "pwa-previewer-last-export-v1";

  const APP_NS_PREFIX = "__app:";

  const PHONE_W = 402, PHONE_H = 874, PHONE_B = 6;
  const IPAD_W  = 1366, IPAD_H  = 1024, IPAD_B  = 12;

  const SB_BACK_DX          = 45;
  const SB_EXPAND_DX_FOLDER = 200;
  const SB_EXPAND_DX_ROOT   = 45;

  /* ===== 改善①：TAP_BRIDGE → INJECTED_RUNTIME（タップ＋エラー通知） ===== */
  const INJECTED_RUNTIME =
    '<script>(function(){' +
      'var send=function(){try{parent.postMessage({__pwaPreviewTap:1},"*");}catch(e){}};' +
      'document.addEventListener("click",send,true);' +
      'document.addEventListener("pointerup",send,true);' +
      'window.addEventListener("error",function(e){' +
        'try{parent.postMessage({__pwaPreviewError:String(e.message||e.error||"unknown")},"*");}catch(_){}' +
      '});' +
      'window.addEventListener("unhandledrejection",function(e){' +
        'try{parent.postMessage({__pwaPreviewError:"Unhandled: "+String(e.reason||"unknown")},"*");}catch(_){}' +
      '});' +
    '})();<\/script>';

  let items = [];
  let folders = [];
  let selectedId = null;
  let editingId = null;
  let currentFolderId = null;
  let sidebarOpen = window.innerWidth >= 760;
  let currentDevice = "phone";
  let memoNoteId = null;

  const source     = $("source");
  const nameInput  = $("nameInput");
  const framePhone = $("framePhone");
  const frameIpad  = $("frameIpad");
  const fullFrame  = $("fullFrame");

  const WEEKDAYS = ["日","月","火","水","木","金","土"];

  const ICON = {
    folder: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6.6A2.6 2.6 0 0 1 5.6 4h3.1c.55 0 1.07.24 1.43.66l1.02 1.2c.2.23.48.36.79.36h6.46A2.6 2.6 0 0 1 21 8.82V17.4A2.6 2.6 0 0 1 18.4 20H5.6A2.6 2.6 0 0 1 3 17.4V6.6z"/></svg>`,
    back:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>`,
    edit:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>`,
    move:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13"/><path d="M12.5 6l6 6-6 6"/></svg>`,
    trash:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>`,
    eraser: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 20H8.5L2.9 14.4a2 2 0 0 1 0-2.8l9-9a2 2 0 0 1 2.8 0L22 10a2 2 0 0 1 0 2.8l-9 9"/><path d="M7.5 9.5l7 7"/></svg>`
  };

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  function escapeHtml(s){
    return String(s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function firstGrapheme(s){
    if(!s) return "";
    if(typeof Intl !== "undefined" && Intl.Segmenter){
      try{
        const seg = new Intl.Segmenter(undefined, { granularity: "grapheme" });
        const it = seg.segment(s)[Symbol.iterator]().next();
        if(!it.done) return it.value.segment;
      }catch(_){}
    }
    const arr = Array.from(s);
    return arr.length ? arr[0] : "";
  }

  function formatDate(ts){
    const d = new Date(ts);
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    const day = d.getDate();
    const w = WEEKDAYS[d.getDay()];
    const h = String(d.getHours()).padStart(2,"0");
    const min = String(d.getMinutes()).padStart(2,"0");
    return `${y}/${m}/${day}（${w}）${h}:${min}`;
  }

  function byteLength(s){
    let n = 0;
    for(let i = 0; i < s.length; i++){
      const c = s.charCodeAt(i);
      if(c < 0x80) n += 1;
      else if(c < 0x800) n += 2;
      else if(c >= 0xD800 && c <= 0xDBFF){ n += 4; i++; }
      else n += 3;
    }
    return n;
  }
  function formatBytes(n){
    if(n < 1024) return n + " B";
    if(n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
    return (n / 1024 / 1024).toFixed(2) + " MB";
  }

  function colorFor(s){
    let h = 0;
    for(let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
    return `hsl(${h} 62% 42%)`;
  }

  function validIcon(v){
    return typeof v === "string" && /^data:image\//.test(v);
  }

  function iconInner(it){
    if(validIcon(it.icon)){
      return `<img src="${it.icon}" alt="">`;
    }
    const name = (it.name || "無").trim();
    const ch = firstGrapheme(name) || "無";
    return `<span class="ico-letter" style="background:${colorFor(name)}">${escapeHtml(ch)}</span>`;
  }

  function folderIconInner(f){
    if(f && typeof f.emoji === "string" && f.emoji){
      return `<span class="ico-emoji">${escapeHtml(f.emoji)}</span>`;
    }
    return ICON.folder;
  }

  const ENTITIES = {
    amp:"&", lt:"<", gt:">", quot:'"', apos:"'", nbsp:" ",
    copy:"©", reg:"®", trade:"™", hellip:"…", mdash:"—", ndash:"–",
    laquo:"«", raquo:"»", yen:"¥", middot:"·"
  };
  function decodeEntities(s){
    return String(s).replace(/&(#x[0-9a-fA-F]+|#[0-9]+|[a-zA-Z][a-zA-Z0-9]*);/g, (m, e) => {
      if(e.charAt(0) === "#"){
        const hex = e.charAt(1).toLowerCase() === "x";
        const code = hex ? parseInt(e.slice(2), 16) : parseInt(e.slice(1), 10);
        if(!isNaN(code) && code > 0 && code <= 0x10FFFF){
          try{ return String.fromCodePoint(code); }catch(_){ return m; }
        }
        return m;
      }
      const key = e.toLowerCase();
      return Object.prototype.hasOwnProperty.call(ENTITIES, key) ? ENTITIES[key] : m;
    });
  }
  function extractHtmlTitle(html){
    if(!html) return "";
    const m = String(html).match(/<title[^>]*>([\s\S]*?)<\/title\s*>/i);
    if(!m) return "";
    let t = m[1].replace(/<[^>]*>/g, "");
    t = decodeEntities(t).replace(/\s+/g, " ").trim();
    return t.slice(0, 80);
  }

  function getLastExportAt(){
    const v = localStorage.getItem(LAST_EXPORT_KEY);
    const n = v ? Number(v) : 0;
    return isNaN(n) ? 0 : n;
  }
  function setLastExportAt(t){
    try{ localStorage.setItem(LAST_EXPORT_KEY, String(t)); }catch(_){}
  }

  function updateExportBadge(){
    const btn = $("btnSettings");
    if(!btn) return;
    const last = getLastExportAt();
    const count = items.filter(it => (it.updated || 0) > last).length;
    let badge = btn.querySelector(".badge");
    if(count > 0){
      if(!badge){
        badge = document.createElement("span");
        badge.className = "badge";
        btn.appendChild(badge);
      }
      badge.textContent = count > 99 ? "99+" : String(count);
    }else if(badge){
      badge.remove();
    }
  }

  function persist(){
    try{
      localStorage.setItem(NOTES_KEY, JSON.stringify(items));
      localStorage.setItem(FOLDERS_KEY, JSON.stringify(folders));
    }catch(e){
      console.warn("persist failed", e);
      showToast("保存容量が不足しています");
    }
    updateExportBadge();
  }

  /* ===== アプリデータ管理（案1：名前空間プレフィックス） ===== */
  function appNamespace(appId){
    return APP_NS_PREFIX + String(appId || "") + ":";
  }

  function appStorageInfo(appId){
    if(!appId) return { count: 0, bytes: 0 };
    const ns = appNamespace(appId);
    let count = 0, bytes = 0;
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(ns) === 0){
        const v = localStorage.getItem(k) || "";
        count++;
        // UTF-16 概算
        bytes += (k.length + v.length) * 2;
      }
    }
    return { count, bytes };
  }

  function deleteAppData(appId){
    if(!appId) return 0;
    const ns = appNamespace(appId);
    const keys = [];
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(ns) === 0) keys.push(k);
    }
    keys.forEach(k => {
      try{ localStorage.removeItem(k); }catch(_){}
    });
    return keys.length;
  }

  function deleteAllAppData(){
    const keys = [];
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(APP_NS_PREFIX) === 0) keys.push(k);
    }
    keys.forEach(k => {
      try{ localStorage.removeItem(k); }catch(_){}
    });
    return keys.length;
  }

  /* ===== 名前空間シム（iframe内のlocalStorageをアプリ別に分離） ===== */
  function buildStorageShim(appId){
    const idLit = JSON.stringify(String(appId || ""));
    return '<script>(function(){' +
      'try{' +
        'var NS = "__app:" + ' + idLit + ' + ":";' +
        'var PLS = window.parent && window.parent.localStorage;' +
        'if(!PLS) return;' +
        'function ownKeys(){' +
          'var out=[];' +
          'for(var i=0;i<PLS.length;i++){' +
            'var k=PLS.key(i);' +
            'if(k && k.indexOf(NS)===0) out.push(k.slice(NS.length));' +
          '}' +
          'return out;' +
        '}' +
        'var fake={' +
          'getItem:function(k){return PLS.getItem(NS+String(k));},' +
          'setItem:function(k,v){PLS.setItem(NS+String(k),String(v));},' +
          'removeItem:function(k){PLS.removeItem(NS+String(k));},' +
          'clear:function(){ownKeys().forEach(function(k){PLS.removeItem(NS+k);});},' +
          'key:function(i){var ks=ownKeys();return (i>=0&&i<ks.length)?ks[i]:null;}' +
        '};' +
        'Object.defineProperty(fake,"length",{' +
          'get:function(){return ownKeys().length;},configurable:true' +
        '});' +
        'try{' +
          'Object.defineProperty(window,"localStorage",{' +
            'configurable:true,get:function(){return fake;}' +
          '});' +
        '}catch(e){}' +
      '}catch(e){}' +
    '})();<\/script>';
  }

  /* ===== 改善②：buildSrcdoc を安全な注入位置に変更 ===== */
  function buildSrcdoc(appId, fullHtml){
    const shim = buildStorageShim(appId);
    let html = String(fullHtml || "");

    // 旧バージョン TAP_BRIDGE 残骸の除去（安全弁）
    html = html.replace(/\s*<script>\(function\(\)\{var send=function\(\)\{try\{parent\.postMessage\(\{__pwaPreviewTap:1\},"\*"\);\}catch\(e\)\{\}\};[\s\S]*?\}\)\(\);<\/script>\s*$/i, "");

    // <base target="_self"> でリンク誤動作防止
    const baseTag = '<base target="_self">';

    // shim + base を <meta charset> 直後（無ければ <head> 直後）へ
    const charsetMatch = html.match(/<meta[^>]+charset=[^>]*>/i);
    const headMatch = html.match(/<head[^>]*>/i);

    if(charsetMatch && charsetMatch.index !== undefined){
      const pos = charsetMatch.index + charsetMatch[0].length;
      html = html.slice(0, pos) + shim + baseTag + html.slice(pos);
    }else if(headMatch && headMatch.index !== undefined){
      const pos = headMatch.index + headMatch[0].length;
      html = html.slice(0, pos) + shim + baseTag + html.slice(pos);
    }else if(/<html[^>]*>/i.test(html)){
      html = html.replace(/<html([^>]*)>/i, '<html$1><head>' + shim + baseTag + '</head>');
    }else{
      html = shim + baseTag + html;
    }

    // runtime を </body> 直前に注入（無ければ </html> 直前）
    if(/<\/body>/i.test(html)){
      html = html.replace(/<\/body>/i, INJECTED_RUNTIME + '</body>');
    }else if(/<\/html>/i.test(html)){
      html = html.replace(/<\/html>/i, INJECTED_RUNTIME + '</html>');
    }else{
      html = html + INJECTED_RUNTIME;
    }

    return html;
  }

  function load(){
    folders = [];
    try{
      const rawF = localStorage.getItem(FOLDERS_KEY);
      if(rawF){
        const p = JSON.parse(rawF);
        if(Array.isArray(p)) folders = p.filter(f => f && typeof f === "object" && f.id);
      }
    }catch(e){ folders = []; }
    folders.forEach(f => {
      if(typeof f.name !== "string" || !f.name) f.name = "無題のフォルダ";
      if(f.emoji !== undefined && typeof f.emoji !== "string") delete f.emoji;
      if(typeof f.emoji === "string" && f.emoji) f.emoji = firstGrapheme(f.emoji);
    });

    items = [];
    try{
      const raw = localStorage.getItem(NOTES_KEY);
      if(raw){
        const p = JSON.parse(raw);
        if(Array.isArray(p)) items = p;
      }else{
        const old = localStorage.getItem(OLD_KEY);
        if(old){
          items = [{ id: uid(), name: "移行したHTML", html: old, updated: Date.now() }];
        }
      }
    }catch(e){ items = []; }
    if(!Array.isArray(items)) items = [];
    items = items.filter(it => it && typeof it === "object");

    const fids = new Set(folders.map(f => f.id));
    items.forEach(it => {
      if(!it.id) it.id = uid();
      if(typeof it.name !== "string") it.name = "無題";
      if(typeof it.html !== "string") it.html = "";
      if(typeof it.updated !== "number") it.updated = Date.now();
      if(!it.folderId || !fids.has(it.folderId)) it.folderId = folders[0]?.id || null;
      if(it.icon !== undefined && !validIcon(it.icon)) delete it.icon;
      if(it.prevHtml !== undefined && typeof it.prevHtml !== "string") delete it.prevHtml;
      if(it.prevUpdated !== undefined && typeof it.prevUpdated !== "number") delete it.prevUpdated;
      if(typeof it.memo !== "string") it.memo = "";
    });

    selectedId = items.length ? items[0].id : null;
    currentFolderId = null;
    persist();
  }

  function fitIframe(iframe, wrapEl, deviceW, deviceH){
    if(!wrapEl) return;
    const rect = wrapEl.getBoundingClientRect();
    if(!rect.width || !rect.height) return;
    const scale = Math.min(rect.width / deviceW, rect.height / deviceH);
    iframe.style.transform = `scale(${scale})`;
  }

  function resizeAllPreviews(){
    fitIframe(framePhone, document.querySelector(".phone-viewport"), PHONE_W, PHONE_H);
    fitIframe(frameIpad,  document.querySelector(".ipad-viewport"),  IPAD_W,  IPAD_H);
  }

  function fitDevices(){
    const stage = $("stage");
    const sw = Math.max(80, stage.clientWidth  - 16);
    const sh = Math.max(80, stage.clientHeight - 10);

    const phone = $("phone");
    const ipad  = $("ipad");

    if(!phone.hidden){
      const k0 = Math.min(
        (sw - 2*PHONE_B) / PHONE_W,
        (sh - 2*PHONE_B) / PHONE_H
      );
      const bw = Math.max(2, Math.min(PHONE_B, Math.round(PHONE_B * k0)));
      const k = Math.min(
        (sw - 2*bw) / PHONE_W,
        (sh - 2*bw) / PHONE_H
      );
      const w = PHONE_W * k + 2*bw;
      const h = PHONE_H * k + 2*bw;
      phone.style.borderWidth = bw + "px";
      phone.style.width  = w.toFixed(2) + "px";
      phone.style.height = h.toFixed(2) + "px";
      const rad = Math.max(16, w * 0.135);
      phone.style.borderRadius = rad.toFixed(1) + "px";
      const vp = phone.querySelector(".phone-viewport");
      vp.style.borderRadius = Math.max(0, rad - bw - 1).toFixed(1) + "px";

      const island = phone.querySelector(".island");
      if(island){
        island.style.height = Math.max(10, 34 * k).toFixed(2) + "px";
        island.style.top    = Math.max(3, 11 * k).toFixed(2) + "px";
        island.style.borderRadius = Math.max(6, 100 * k).toFixed(1) + "px";
      }
      const homebar = phone.querySelector(".homebar");
      if(homebar){
        homebar.style.height = Math.max(2, 4 * k).toFixed(2) + "px";
        homebar.style.bottom = Math.max(3, 8 * k).toFixed(2) + "px";
      }
    }

    if(!ipad.hidden){
      const k0 = Math.min(
        (sw - 2*IPAD_B) / IPAD_W,
        (sh - 2*IPAD_B) / IPAD_H
      );
      const bw = Math.max(3, Math.min(IPAD_B, Math.round(IPAD_B * k0)));
      const k = Math.min(
        (sw - 2*bw) / IPAD_W,
        (sh - 2*bw) / IPAD_H
      );
      const w = IPAD_W * k + 2*bw;
      const h = IPAD_H * k + 2*bw;
      ipad.style.borderWidth = bw + "px";
      ipad.style.width  = w.toFixed(2) + "px";
      ipad.style.height = h.toFixed(2) + "px";
      const rad = Math.max(8, Math.min(w, h) * 0.05);
      ipad.style.borderRadius = rad.toFixed(1) + "px";
      const vp = ipad.querySelector(".ipad-viewport");
      vp.style.borderRadius = Math.max(0, rad - bw).toFixed(1) + "px";
    }
  }

  function resizeFullscreen(){
    if(!$("fullscreen").classList.contains("show")) return;
    const stage = $("fsStage");
    const dW = PHONE_W, dH = PHONE_H;
    const scale = Math.min(stage.clientWidth / dW, stage.clientHeight / dH);
    fullFrame.style.width  = dW + "px";
    fullFrame.style.height = dH + "px";
    fullFrame.style.transform = `scale(${scale})`;
    fullFrame.style.transformOrigin = "center center";
  }

  function isStandalone(){
    try{
      if(window.navigator.standalone === true) return true;
      if(window.matchMedia){
        if(window.matchMedia("(display-mode: standalone)").matches) return true;
        if(window.matchMedia("(display-mode: fullscreen)").matches) return true;
        if(window.matchMedia("(display-mode: minimal-ui)").matches) return true;
      }
    }catch(_){}
    return false;
  }

  function measureSafeAreaInsets(){
    const probe = document.createElement("div");
    probe.style.cssText =
      "position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;" +
      "padding-top:env(safe-area-inset-top,0px);" +
      "padding-bottom:env(safe-area-inset-bottom,0px);";
    document.body.appendChild(probe);
    const cs = getComputedStyle(probe);
    const top    = parseFloat(cs.paddingTop) || 0;
    const bottom = parseFloat(cs.paddingBottom) || 0;
    probe.remove();
    return { top, bottom };
  }

  function syncAppHeight(){
    const root = document.documentElement;
    if(!isStandalone()){
      root.style.removeProperty("--app-h");
      return;
    }
    const insets = measureSafeAreaInsets();
    let h = window.innerHeight + insets.top + insets.bottom;

    const scr = window.screen || {};
    const scrMax = Math.max(scr.height || 0, scr.width || 0);
    if(scrMax > 0) h = Math.min(h, scrMax);

    if(!isFinite(h) || h <= 0) return;
    root.style.setProperty("--app-h", Math.round(h) + "px");
  }

  function relayout(){
    syncAppHeight();
    fitDevices();
    resizeAllPreviews();
    resizeFullscreen();
  }

  window.addEventListener("resize", relayout);
  window.addEventListener("orientationchange", () => setTimeout(relayout, 120));
  if(window.visualViewport){
    window.visualViewport.addEventListener("resize", relayout);
  }

  if(window.ResizeObserver){
    const ro = new ResizeObserver(() => {
      fitDevices();
      resizeAllPreviews();
    });
    ro.observe($("stage"));
  }

  /* ===== 改善③：updatePreview（bridge二重付与を撤去）＋ checkIframeRender ===== */
  function updatePreview(){
    const it = items.find(x => x.id === selectedId);
    if(!it){ clearPreviews(); updateMemoIndicator(); return; }
    const html = buildSrcdoc(it.id, it.html || "");

  function checkIframeRender(iframe, label){
    setTimeout(() => {
      try{
        const doc = iframe.contentDocument;
        if(!doc || !doc.body) return;
        const childCount = doc.body.children.length;
        if(childCount === 0){
          console.warn(`[${label}] iframe body is empty`);
          showToast(`${label}プレビューが空です（HTMLを確認してください）`);
        }
      }catch(_){ /* cross-origin時は無視 */ }
    }, 400);
  }

  function handleOutsideTap(){
    const openSwipes = $("sideList").querySelectorAll(".swipe.open");
    if(openSwipes.length > 0){
      closeAllSwipes();
      return;
    }
    if(sidebarOpen) setSidebar(false);
  }

  /* ===== 改善④：メッセージ受信でタップ＋エラーの両方を扱う ===== */
  window.addEventListener("message", e => {
    const d = e.data;
    if(!d || typeof d !== "object") return;

    // タップ通知
    if(d.__pwaPreviewTap){
      let ok = false;
      try{
        ok = (e.source === framePhone.contentWindow) || (e.source === frameIpad.contentWindow);
      }catch(_){ ok = true; }
      if(!ok) return;
      const now = Date.now();
      if(now - (handleOutsideTap.__last || 0) < 120) return;
      handleOutsideTap.__last = now;
      handleOutsideTap();
      return;
    }

    // エラー通知（プレビュー内のJSエラーを可視化）
    if(d.__pwaPreviewError){
      const msg = String(d.__pwaPreviewError || "unknown");
      console.error("[preview error]", msg);
      showToast("プレビュー内エラー: " + msg.slice(0, 40));
      return;
    }
  });

  let toastTimer = null;
  function showToast(msg){
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 1300);
  }

  function updateSwipeHint(dx){
    const hint = $("swipeHint");
    let text = "", ready = false, show = false, action = "";

    if(dx >= 5){
      show = true;
      if(!sidebarOpen){
        if(currentFolderId !== null){
          if(dx >= SB_EXPAND_DX_FOLDER){
            text = "メニューを開く";
            ready = true;
            action = "menu";
          }else{
            text = "一覧に戻る";
            ready = dx >= SB_BACK_DX;
            action = "back";
          }
        }else{
          text = "メニューを開く";
          ready = dx >= SB_EXPAND_DX_ROOT;
          action = "menu";
        }
      }else{
        if(currentFolderId !== null){
          text = "一覧に戻る";
          ready = dx >= SB_BACK_DX;
          action = "back";
        }else{
          text = "メニューを閉じる";
          ready = dx >= SB_BACK_DX;
          action = "close";
        }
      }
    }

    if(!show){
      hint.classList.remove("show", "ready", "menu-ready");
      return;
    }

    hint.textContent = text;
    hint.classList.toggle("ready", ready && action !== "menu");
    hint.classList.toggle("menu-ready", ready && action === "menu");
    hint.classList.add("show");

    const sidebar = $("sidebar");
    const r = sidebar.getBoundingClientRect();
    const hw = hint.offsetWidth || 120;
    let left = r.right + 10;
    if(left + hw > window.innerWidth - 10){
      left = window.innerWidth - hw - 10;
    }
    if(left < 10) left = 10;
    hint.style.left = left + "px";
  }

  function hideSwipeHint(){
    const hint = $("swipeHint");
    hint.classList.remove("show", "ready", "menu-ready");
  }

  function render(animate, dir){
    const list = $("sideList");
    const isRoot = currentFolderId === null;

    let html = "";

    if(!isRoot){
      html += `
        <div class="srow" id="rowBack">
          <div class="row-icon" style="color:var(--accent)">${ICON.back}</div>
          <div class="row-main"><div class="row-title">フォルダ一覧</div></div>
        </div>`;
    }

    if(isRoot){
      if(folders.length === 0){
        html += `<div class="side-empty">フォルダがありません<br>「＋」から作成</div>`;
      }else{
        html += folders.map((f,i) => folderRowHtml(f,i)).join("");
      }
    }else{
      const listNotes = items.filter(x => x.folderId === currentFolderId);
      if(listNotes.length === 0){
        html += `<div class="side-empty">メモがありません<br>「＋」から追加</div>`;
      }else{
        html += listNotes.map((it,i) => noteRowHtml(it,i)).join("");

    list.innerHTML = html;

      list.classList.remove("anim-in", "anim-in-right");

      setTimeout(() => {
        list.classList.remove("anim-in", "anim-in-right");
      }, 280);

    list.querySelectorAll(".swipe").forEach(attachRow);

  function miniIconsHtml(folderId){

    if(!list.length) return "";
    return `<div class="row-apps">${list.map(it => {
      if(validIcon(it.icon)){
        return `<span class="mini-app"><img src="${it.icon}" alt=""></span>`;
      }

      const ch = firstGrapheme(name) || "無";

  function folderRowHtml(f, index){

  function handleSidebarSwipe(dx){
    if(!sidebarOpen){
      if(currentFolderId !== null){
        if(dx >= SB_EXPAND_DX_FOLDER){
          setSidebar(true);
          return;
        }
        if(dx >= SB_BACK_DX){
          goRoot(true);
        }
      }else{
        if(dx >= SB_EXPAND_DX_ROOT){
          setSidebar(true);
        }
      }
    }else{
      if(dx >= SB_BACK_DX){
        if(currentFolderId !== null) goRoot(true);
        else setSidebar(false);
      }
    }
  }

  let dragActive = false;
  let dragEndedAt = 0;
  let dragCtx = null;
  let chipEls = [];
  let chipScrollDir = 0;
  let chipRAF = null;

  function closeSwipe(wrap){
    wrap.classList.remove("open");
    const row = wrap.querySelector(".srow");
    if(row){ row.style.transition = ""; row.style.transform = ""; }
  }
  function closeAllSwipes(){
    $("sideList").querySelectorAll(".swipe.open").forEach(closeSwipe);
  }
  function anySwipeOpen(){
    return $("sideList").querySelectorAll(".swipe.open").length > 0;
  }

  function attachRow(wrap){
    const row     = wrap.querySelector(".srow");
    const actions = wrap.querySelector(".swipe-actions");
    if(!row || !actions) return;

    const type  = wrap.dataset.type;
    const id    = wrap.dataset.id;
    const index = Number(wrap.dataset.index) || 0;

    actions.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", ev => {
        ev.stopPropagation();
        ev.preventDefault();
        closeAllSwipes();
        handleAction(type, id, btn.dataset.act);
      });
    });

    let pid = null, sx = 0, sy = 0, baseX = 0, curX = 0, maxOpen = 0;
    let mode = null;
    let lastDx = 0;
    let pressTimer = null;
    let longPressed = false;

    const clearPress = () => { if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; } };

    row.addEventListener("pointerdown", e => {
      if(dragActive) return;
      if(e.pointerType === "mouse" && e.button !== 0) return;

      pid = e.pointerId;
      sx = e.clientX; sy = e.clientY;
      mode = null;
      lastDx = 0;
      longPressed = false;
      maxOpen = actions.offsetWidth || 0;
      baseX = wrap.classList.contains("open") ? -maxOpen : 0;
      curX = baseX;
      row.style.transition = "none";

      if(baseX === 0){
        clearPress();
        pressTimer = setTimeout(() => {
          pressTimer = null;
          if(dragActive) return;
          longPressed = true;
          mode = "drag";
          try{ row.setPointerCapture(pid); }catch(_){}
          beginDrag(wrap, row, type, index, sy);
        }, 420);
      }
    });

    row.addEventListener("pointermove", e => {
      if(pid === null || e.pointerId !== pid) return;
      const dx = e.clientX - sx;
      const dy = e.clientY - sy;
      lastDx = dx;

      if(mode === "drag"){
        updateDrag(e.clientX, e.clientY);
        return;
      }
      if(mode === null){
        if(Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.2){
          clearPress();
          mode = (dx > 0 && baseX === 0) ? "sb" : "h";
          try{ row.setPointerCapture(pid); }catch(_){}
        }else if(Math.abs(dy) > 10){
          clearPress();
          mode = "v";
          row.style.transition = "";
          return;
        }else{
          return;
        }
      }
      if(mode === "h"){
        curX = Math.max(-maxOpen, Math.min(0, baseX + dx));
        row.style.transform = `translateX(${curX}px)`;
      }else if(mode === "sb"){
        updateSwipeHint(dx);
      }
    });

    const finish = e => {
      if(pid === null) return;
      if(e && e.pointerId !== undefined && e.pointerId !== pid) return;

      clearPress();
      const wasMode = mode;
      const releaseId = pid;
      pid = null;
      row.style.transition = "";

      if(wasMode === "h"){
        if(curX < -maxOpen * 0.45){
          wrap.classList.add("open");
          row.style.transform = `translateX(${-maxOpen}px)`;
        }else{
          wrap.classList.remove("open");
          row.style.transform = "";
        }
      }else if(wasMode === "drag"){
        endDrag();
      }else if(wasMode === "sb"){
        hideSwipeHint();
        handleSidebarSwipe(lastDx);
      }
      mode = null;
      try{ row.releasePointerCapture(releaseId); }catch(_){}
    };

    row.addEventListener("pointerup", finish);
    row.addEventListener("pointercancel", () => {
      clearPress();
      if(mode === "drag") endDrag();
      if(mode === "sb") hideSwipeHint();
      mode = null; pid = null;
      row.style.transition = "";
    });
    row.addEventListener("pointerleave", () => { if(!dragActive) clearPress(); });

    row.addEventListener("click", () => {
      if(Date.now() - dragEndedAt < 350) return;
      if(longPressed){ longPressed = false; return; }
      if(wrap.classList.contains("open") || anySwipeOpen()){
        closeAllSwipes();
        return;
      }
      if(type === "folder") openFolder(id);
      else selectNote(id);
    });

    row.addEventListener("contextmenu", e => e.preventDefault());
  }

  document.addEventListener("click", e => {
    if(!anySwipeOpen()) return;
    if(e.target.closest(".swipe-actions button")) return;
    if(e.target.closest(".swipe.open .srow")) return;
    closeAllSwipes();
  }, true);

  (function attachScrollGesture(){
    const sc = $("sideScroll");
    let pid = null, sx = 0, sy = 0;
    let hintOn = false;

    sc.addEventListener("pointerdown", e => {
      if(e.target.closest(".srow")) return;
      if(e.target.closest("button")) return;
      pid = e.pointerId;
      sx = e.clientX; sy = e.clientY;
      hintOn = false;
    });

    sc.addEventListener("pointermove", e => {
      if(pid === null || e.pointerId !== pid) return;
      const dx = e.clientX - sx;
      const dy = e.clientY - sy;
      if(dx > 5 && Math.abs(dx) > Math.abs(dy) * 1.2){
        hintOn = true;
        updateSwipeHint(dx);
      }else if(Math.abs(dy) > Math.abs(dx)){
        if(hintOn){ hintOn = false; hideSwipeHint(); }
      }
    });

    sc.addEventListener("pointerup", e => {
      if(pid === null || e.pointerId !== pid) return;
      const dx = e.clientX - sx;
      const dy = e.clientY - sy;
      pid = null;
      if(hintOn) hideSwipeHint();
      hintOn = false;
      if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 20){
        handleSidebarSwipe(dx);
      }
    });

    sc.addEventListener("pointercancel", () => {
      pid = null;
      if(hintOn) hideSwipeHint();
      hintOn = false;
    });
  })();

  (function preventEdgeBackSwipe(){
    let edgeTouch = null;

    document.addEventListener("touchstart", e => {
      if(e.touches.length !== 1){ edgeTouch = null; return; }
      const t = e.touches[0];
      if(t.clientX <= 22){
        edgeTouch = { id: t.identifier, x: t.clientX, y: t.clientY };
      }else{
        edgeTouch = null;
      }
    }, { passive: true });

    document.addEventListener("touchmove", e => {
      if(!edgeTouch) return;
      let t = null;
      for(const tt of e.touches){
        if(tt.identifier === edgeTouch.id){ t = tt; break; }
      }
      if(!t){ edgeTouch = null; return; }
      const dx = t.clientX - edgeTouch.x;
      const dyAbs = Math.abs(t.clientY - edgeTouch.y);
      if(dx > 3 && dx >= dyAbs * 0.5){
        if(e.cancelable) e.preventDefault();
      }
    }, { passive: false });

    const clear = () => { edgeTouch = null; };
    document.addEventListener("touchend", clear, { passive: true });
    document.addEventListener("touchcancel", clear, { passive: true });
  })();

  function beginDrag(wrap, row, type, index, startY){
    const wraps = [...$("sideList").querySelectorAll(".swipe")];
    const rowH  = wrap.offsetHeight || 60;

    dragActive = true;
    dragCtx = {
      wrap, row, type, index,
      from: index, to: index, startY,
      wraps, rowH, moved: false, targetFolder: null,
      px: 0, py: 0
    };
    wrap.classList.add("dragging");
    if(type === "note") buildDragFolders();
  }

  function updateDrag(x, y){
    const c = dragCtx;
    if(!c) return;
    c.px = x; c.py = y;

    const dy = y - c.startY;
    if(Math.abs(dy) > 4) c.moved = true;

    c.to = Math.max(0, Math.min(c.wraps.length - 1, c.from + Math.round(dy / c.rowH)));
    c.wrap.style.transform = `translateY(${dy}px)`;

    c.wraps.forEach((w, i) => {
      if(w === c.wrap) return;
      let shift = 0;
      if(c.from < c.to && i > c.from && i <= c.to) shift = -c.rowH;
      else if(c.from > c.to && i < c.from && i >= c.to) shift = c.rowH;
      w.style.transform = shift ? `translateY(${shift}px)` : "";
    });

    if(c.type === "note"){
      updateChipAutoScroll(x, y);
      const hit = chipAt(x, y);
      c.targetFolder = hit ? hit.id : null;
      updateChipHighlight(c.targetFolder);
    }
  }

  function endDrag(){
    const c = dragCtx;
    dragCtx = null;
    dragActive = false;
    dragEndedAt = Date.now();
    if(!c) return;

    c.wrap.classList.remove("dragging");
    c.wrap.style.transform = "";
    c.wraps.forEach(w => { w.style.transform = ""; });

    stopChipAutoScroll();
    if(c.type === "note") hideDragFolders();

    if(!c.moved) return;

    if(c.type === "note" && c.targetFolder && c.targetFolder !== currentFolderId){
      moveNoteToFolder(c.wrap.dataset.id, c.targetFolder);
      return;
    }
    if(c.to !== c.from){
      if(c.type === "folder") reorderFolders(c.from, c.to);
      else reorderNotes(c.from, c.to);
    }
  }

  function reorderFolders(from, to){
    if(from < 0 || from >= folders.length) return;
    if(to   < 0 || to   >= folders.length) return;
    const [m] = folders.splice(from, 1);
    folders.splice(to, 0, m);
    persist();
    render();
  }

  function reorderNotes(from, to){
    const idxs = [];
    items.forEach((it, i) => { if(it.folderId === currentFolderId) idxs.push(i); });
    const list = idxs.map(i => items[i]);
    if(from < 0 || from >= list.length) return;
    if(to   < 0 || to   >= list.length) return;
    const [m] = list.splice(from, 1);
    list.splice(to, 0, m);
    idxs.forEach((gi, k) => { items[gi] = list[k]; });
    persist();
    render();
  }

  function buildDragFolders(){
    const bar = $("dragFolders");
    bar.innerHTML = folders.map(f => {
      const cur = f.id === currentFolderId;
      return `<div class="chip${cur ? " current" : ""}" data-folder="${f.id}">${escapeHtml(f.name)}</div>`;
    }).join("");
    bar.classList.add("show");
    bar.scrollLeft = 0;

    requestAnimationFrame(() => {
      chipEls = [...bar.querySelectorAll(".chip")].map(el => ({
        id: el.dataset.folder,
        el
      }));
      const cur = chipEls.find(c => c.id === currentFolderId);
      if(cur){
        const r = cur.el.getBoundingClientRect();
        const br = bar.getBoundingClientRect();
        if(r.left < br.left || r.right > br.right){
          bar.scrollLeft += (r.left - br.left) - 12;
        }
      }
    });
  }

  function hideDragFolders(){
    const bar = $("dragFolders");
    bar.classList.remove("show");
    bar.innerHTML = "";
    chipEls = [];
    stopChipAutoScroll();
  }

  function chipAt(x, y){
    for(const c of chipEls){
      const r = c.el.getBoundingClientRect();
      if(x >= r.left - 12 && x <= r.right + 12 && y >= r.top - 34 && y <= r.bottom + 26){
        return c;
      }
    }
    return null;
  }

  function updateChipHighlight(id){
    chipEls.forEach(c => c.el.classList.toggle("over", !!id && c.id === id));
  }

  function updateChipAutoScroll(x, y){
    const bar = $("dragFolders");
    if(!bar.classList.contains("show")) return;
    const r = bar.getBoundingClientRect();
    if(y < r.top - 40 || y > r.bottom + 60){ chipScrollDir = 0; return; }
    const edge = 80;
    if(x < r.left + edge) chipScrollDir = -1;
    else if(x > r.right - edge) chipScrollDir = 1;
    else chipScrollDir = 0;
    if(chipScrollDir !== 0) startChipAutoScroll();
  }

  function startChipAutoScroll(){
    if(chipRAF) return;
    const step = () => {
      if(!dragActive){ chipRAF = null; return; }
      const bar = $("dragFolders");
      if(chipScrollDir !== 0 && bar.classList.contains("show")){
        const before = bar.scrollLeft;
        bar.scrollLeft += chipScrollDir * 10;
        if(bar.scrollLeft !== before && dragCtx){
          const hit = chipAt(dragCtx.px, dragCtx.py);
          dragCtx.targetFolder = hit ? hit.id : null;
          updateChipHighlight(dragCtx.targetFolder);
        }
      }
      chipRAF = requestAnimationFrame(step);
    };
    chipRAF = requestAnimationFrame(step);
  }

  function stopChipAutoScroll(){
    chipScrollDir = 0;
    if(chipRAF){ cancelAnimationFrame(chipRAF); chipRAF = null; }
  }

  function deleteFolder(id){
    const f = folders.find(x => x.id === id);
    if(!f) return;

    const targets = items.filter(x => x.folderId === id);
    const totalInfo = targets.reduce((acc, t) => {
      const info = appStorageInfo(t.id);
      return { count: acc.count + info.count, bytes: acc.bytes + info.bytes };
    }, { count: 0, bytes: 0 });

    let msg;
    if(targets.length > 0){
      msg = totalInfo.count > 0
        ? `フォルダ「${f.name}」と、中のメモ${targets.length}件（保存データ${totalInfo.count}項目 / 約${formatBytes(totalInfo.bytes)}）を削除しますか？`
        : `フォルダ「${f.name}」と、中のメモ${targets.length}件を削除しますか？`;
    }else{
      msg = `フォルダ「${f.name}」を削除しますか？`;
    }
    if(!confirm(msg)) return;

    targets.forEach(x => deleteAppData(x.id));
    const removedIds = targets.map(x => x.id);
    items   = items.filter(x => x.folderId !== id);
    folders = folders.filter(x => x.id !== id);

    if(removedIds.indexOf(selectedId) !== -1) selectedId = items.length ? items[0].id : null;
    if(currentFolderId === id) currentFolderId = null;

    persist();
    render(true, "back");
    updatePreview();
  }

  function readImageFile(file, maxSize){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          let w = img.naturalWidth || img.width;
          let h = img.naturalHeight || img.height;
          if(!w || !h){ reject(new Error("サイズ不明")); return; }
          const scale = Math.min(1, maxSize / Math.max(w, h));
          w = Math.max(1, Math.round(w * scale));
          h = Math.max(1, Math.round(h * scale));

          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.clearRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);

          let out = null;
          try{
            if(file.type === "image/png"){
              out = canvas.toDataURL("image/png");
            }else{
              out = canvas.toDataURL("image/jpeg", 0.85);
            }
          }catch(e){ out = null; }
          if(!out) out = reader.result;
          resolve(out);
        };
        img.onerror = () => reject(new Error("画像を読み込めません"));
        img.src = reader.result;
      };
      reader.onerror = () => reject(new Error("ファイルを読み込めません"));
      reader.readAsDataURL(file);
    });
  }

  function runSearch(direction){
    const q = $("search").value;
    if(!q){
      $("searchResult").textContent = "";
      clearSearchHighlight();
      return;
    }
    const text = source.value;
    const matches = [];
    let pos = 0;
    while(true){
      const idx = text.indexOf(q, pos);
      if(idx === -1) break;
      matches.push(idx);
      pos = idx + Math.max(q.length, 1);
    }
    searchMatches = matches;

    if(!matches.length){
      $("searchResult").textContent = "0件";
      searchIndex = -1;
      return;
    }

    if(direction === "next"){
      searchIndex = searchIndex === -1 ? 0 : (searchIndex + 1) % matches.length;
    }else if(direction === "prev"){
      searchIndex = searchIndex === -1 ? matches.length - 1 : (searchIndex - 1 + matches.length) % matches.length;
    }else{
      $("searchResult").textContent = `${matches.length}件`;
      searchIndex = -1;
      return;
    }

    const start = matches[searchIndex];
    const end = start + q.length;
    source.focus({ preventScroll: true });
    source.setSelectionRange(start, end);
    scrollTextareaToSelection(start);
    $("searchResult").textContent = `${searchIndex + 1}/${matches.length}件`;
  }

  function scrollTextareaToSelection(charIndex){
    const ta = source;
    const text = ta.value;
    const before = text.slice(0, charIndex);

    const mirror = document.createElement("div");
    const style = getComputedStyle(ta);

    mirror.style.font = style.font;
    mirror.style.padding = style.padding;
    mirror.style.letterSpacing = style.letterSpacing;
    mirror.style.lineHeight = style.lineHeight;
    mirror.style.whiteSpace = "pre-wrap";
    mirror.style.wordBreak = "break-all";
    mirror.style.overflowWrap = "anywhere";
    mirror.style.boxSizing = "border-box";
    mirror.style.border = "none";
    mirror.style.width = ta.clientWidth + "px";
    mirror.style.position = "absolute";
    mirror.style.top = "-9999px";
    mirror.style.left = "-9999px";
    mirror.style.visibility = "hidden";

    const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    mirror.innerHTML = esc(before) + "<span>&#x200b;</span>" + esc(text.slice(charIndex));

    document.body.appendChild(mirror);

    const span = mirror.querySelector("span");
    const spanRect = span.getBoundingClientRect();
    const mirrorRect = mirror.getBoundingClientRect();

    const relTop = spanRect.top - mirrorRect.top;
    const lineHeight = parseFloat(style.lineHeight) || 18;
    const paddingTop = parseFloat(style.paddingTop) || 14;
    const paddingBottom = parseFloat(style.paddingBottom) || 14;
    const visibleHeight = ta.clientHeight - paddingTop - paddingBottom;

    ta.scrollTop = Math.max(0, relTop - visibleHeight / 2 + lineHeight / 2);
    document.body.removeChild(mirror);
  }

    $("phone").hidden = d !== "phone";
    $("ipad").hidden  = d !== "ipad";
    const btn = $("btnDevice");
    if(btn) btn.textContent = d === "phone" ? "iPhone" : "iPad";
    void $("stage").offsetHeight;
    requestAnimationFrame(() => {
      fitDevices();
      resizeAllPreviews();
    });
    setTimeout(() => {
      fitDevices();
      resizeAllPreviews();
    }, 60);
  }

  function setSidebar(open){
    sidebarOpen = open;
    $("sidebar").classList.toggle("open", open);
    requestAnimationFrame(() => {
      fitDevices();
      resizeAllPreviews();
    });
  }

  /* ===== 共有（HTMLファイルのみ） ===== */
  function sanitizeFilename(name){
    return (name || "無題").replace(/[\\/:*?"<>|\n\r\t]/g, "_").slice(0, 80);
  }

  async function shareCurrentHtml(){
    const it = items.find(x => x.id === selectedId);
    if(!it){ showToast("共有するアプリを選択してください"); return; }
    const html = it.html || "";
    if(!html){ showToast("HTMLが空です"); return; }
    const filename = sanitizeFilename(it.name || "アプリ") + ".html";
    const file = new File([html], filename, { type: "text/html" });
    try{
      if(navigator.canShare && navigator.canShare({ files: [file] })){
        await navigator.share({ files: [file] });
        showToast("共有しました");
      }else if(navigator.share){
        await navigator.share({ text: html });
        showToast("共有しました");
      }else{
        showToast("共有機能が利用できません");
      }
    }catch(err){
      if(err && err.name === "AbortError") return;
      console.error(err);
      showToast("共有できませんでした");
    }
  }

  /* ===== 改善依頼（テキスト＋HTMLファイル） ===== */
  async function shareImprovementRequest(){
    const it = items.find(x => x.id === memoNoteId);
    if(!it) return;
    const memo = formatBullets($("memoText").value || "");
    it.memo = memo;
    persist();
    render();
    updatePreview();

    const header = "次の修正して全コードを提供してください。";
    const textContent = header + "\n\n" + (memo || "（改善メモなし）");
    const html = it.html || "";
    const filename = sanitizeFilename((it.name || "アプリ") + "-改善依頼") + ".html";
    const file = new File([html], filename, { type: "text/html" });

    try{
      if(navigator.canShare && navigator.canShare({ files: [file] })){
        await navigator.share({ text: textContent, files: [file] });
        showToast("共有しました");
      }else if(navigator.share){
        await navigator.share({ text: textContent });
        showToast("共有しました");
      }else{
        showToast("共有機能が利用できません");
      }
    }catch(err){
      if(err && err.name === "AbortError") return;
      console.error(err);
      showToast("共有できませんでした");
    }
  }

  function exportAll(){
    const data = {
      app: "pwa-previewer",
      version: 2,
      exportedAt: Date.now(),
      folders: folders.map(f => {
        const o = { id: f.id, name: f.name };
        if(f.emoji) o.emoji = f.emoji;
        return o;
      }),
      items: items.map(it => {
        const o = {
          id: it.id,
          name: it.name,
          html: it.html,
          updated: it.updated,
          folderId: it.folderId
        };
        if(validIcon(it.icon)) o.icon = it.icon;
        if(typeof it.prevHtml === "string") o.prevHtml = it.prevHtml;
        if(typeof it.prevUpdated === "number") o.prevUpdated = it.prevUpdated;
        if(typeof it.memo === "string" && it.memo) o.memo = it.memo;
        return o;
      })
    };
    try{
      const json = JSON.stringify(data);
      const blob = new Blob([json], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "MyApp-BackUp.json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1500);

      setLastExportAt(Date.now());
      updateExportBadge();

      showToast(`エクスポート完了（${items.length}件）`);
    }catch(e){
      alert("エクスポートに失敗しました");
    }
  }

  function normalizeImported(raw){
    const outF = [];
    const outI = [];
    if(!raw || typeof raw !== "object") return { folders: outF, items: outI };

    const srcF = Array.isArray(raw.folders) ? raw.folders : [];
    const srcI = Array.isArray(raw.items) ? raw.items : [];

    srcF.forEach(f => {
      if(!f || typeof f !== "object") return;
      const o = {
        id: typeof f.id === "string" && f.id ? f.id : uid(),
        name: typeof f.name === "string" && f.name ? f.name : "無題のフォルダ"
      };
      if(typeof f.emoji === "string" && f.emoji) o.emoji = firstGrapheme(f.emoji);
      outF.push(o);
    });
    srcI.forEach(it => {
      if(!it || typeof it !== "object") return;
      if(typeof it.html !== "string" && typeof it.name !== "string") return;
      const o = {
        id: typeof it.id === "string" && it.id ? it.id : uid(),
        name: typeof it.name === "string" ? it.name : "無題",
        html: typeof it.html === "string" ? it.html : "",
        updated: typeof it.updated === "number" ? it.updated : Date.now(),
        folderId: typeof it.folderId === "string" ? it.folderId : null
      };
      if(validIcon(it.icon)) o.icon = it.icon;
      if(typeof it.prevHtml === "string") o.prevHtml = it.prevHtml;
      if(typeof it.prevUpdated === "number") o.prevUpdated = it.prevUpdated;
      if(typeof it.memo === "string" && it.memo) o.memo = it.memo;
      outI.push(o);
    });
    return { folders: outF, items: outI };
  }

  async function importAll(file){
    try{
      const text = await file.text();
      const raw = JSON.parse(text);
      const parsed = normalizeImported(raw);
      if(!parsed.folders.length && !parsed.items.length){
        throw new Error("有効なデータがありません");
      }

      const replace = confirm(
        "既存のデータを置き換えますか？\n\nOK：すべて置き換える\nキャンセル：既存に追加（マージ）"
      );

      if(replace){
        deleteAllAppData();

        folders = parsed.folders;
        items = parsed.items;
      }else{
        const idMap = {};
        parsed.folders.forEach(f => {
          const nid = uid();
          idMap[f.id] = nid;
          const nf = { id: nid, name: (f.name || "無題のフォルダ") + " (取込)" };
          if(f.emoji) nf.emoji = f.emoji;
          folders.push(nf);
        });
        const fallback = folders[0]?.id || null;
        parsed.items.forEach(it => {
          const fid = idMap[it.folderId] || fallback;
          const note = {
            id: uid(),
            name: it.name,
            html: it.html,
            updated: it.updated,
            folderId: fid
          };
          if(it.icon) note.icon = it.icon;
          if(typeof it.prevHtml === "string") note.prevHtml = it.prevHtml;
          if(typeof it.prevUpdated === "number") note.prevUpdated = it.prevUpdated;
          if(it.memo) note.memo = it.memo;
          items.push(note);
        });
      }

      const fids = new Set(folders.map(f => f.id));
      items.forEach(it => {
        if(!it.id) it.id = uid();
        if(typeof it.name !== "string") it.name = "無題";
        if(typeof it.html !== "string") it.html = "";
        if(typeof it.updated !== "number") it.updated = Date.now();
        if(!it.folderId || !fids.has(it.folderId)) it.folderId = folders[0]?.id || null;
        if(it.icon !== undefined && !validIcon(it.icon)) delete it.icon;
        if(typeof it.memo !== "string") it.memo = "";
      });

      persist();
      selectedId = items.length ? items[0].id : null;
      currentFolderId = null;
      render(true, "open");
      updatePreview();
      showToast(`インポート完了（${items.length}件）`);
    }catch(err){
      console.error(err);
      alert("インポートに失敗しました：\n" + (err && err.message ? err.message : "不明なエラー"));
    }
  }

  $("btnDevice").onclick = () => {
    setDevice(currentDevice === "phone" ? "ipad" : "phone");
  };

  $("btnNew").onclick = () => {
    if(currentFolderId === null){
      openNewFolderSheet();
    }else{
      openEditor(null, true);
    }
  };

  $("btnSettings").onclick = openSettings;
  $("settingsOverlay").addEventListener("click", e => {
    if(e.target === $("settingsOverlay")) closeSettings();
  });
  $("setExport").onclick = () => { closeSettings(); exportAll(); };
  $("setImport").onclick = () => { closeSettings(); $("importFile").click(); };
  $("importFile").addEventListener("change", async e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if(!file) return;
    await importAll(file);
  });

  $("folderSave").onclick = saveFolderEdit;
  $("folderCancel").onclick = closeFolderEdit;
  $("folderOverlay").addEventListener("click", e => {
    if(e.target === $("folderOverlay")) closeFolderEdit();
  });
  $("folderNameInput").addEventListener("keydown", e => {
    if(e.key === "Enter"){ e.preventDefault(); saveFolderEdit(); }
  });
  $("folderEmojiInput").addEventListener("keydown", e => {
    if(e.key === "Enter"){ e.preventDefault(); saveFolderEdit(); }
  });

  $("btnFullscreen").onclick = openFullscreen;
  $("exit").onclick = () => {
    $("fullscreen").classList.remove("show");
    fullFrame.srcdoc = "";
  };

  $("btnEdit").onclick = () => {
    if(!selectedId){
      showToast("編集するメモを選択してください");
      return;
    }
    openEditor(selectedId, false);
  };

  $("btnShare").onclick = shareCurrentHtml;

  $("btnMemo").onclick = () => {
    if(!selectedId){
      showToast("改善メモを書くアプリを選択してください");
      return;
    }
    openMemo(selectedId);
  };
  $("memoCancel").onclick = e => { e.stopPropagation(); closeMemo(); };
  $("memoOverlay").addEventListener("click", e => {
    if(e.target === $("memoOverlay")) saveMemo();
  });

  $("memoText").addEventListener("keydown", e => {
    if(e.isComposing || e.keyCode === 229) return;
    if(e.key === "Enter"){
      e.preventDefault();
      const ta = $("memoText");
      const pos = ta.selectionStart;
      const end = ta.selectionEnd;
      const before = ta.value.slice(0, pos);
      const after = ta.value.slice(end);
      const insert = "\n・";
      ta.value = before + insert + after;
      const newPos = pos + insert.length;
      try{ ta.setSelectionRange(newPos, newPos); }catch(_){}
    }
  });

  $("memoClear").onclick = e => {
    e.stopPropagation();
    const ta = $("memoText");
    ta.value = "";
    try{ ta.focus(); }catch(_){}
  };

  $("memoRequest").onclick = e => {
    e.stopPropagation();
    shareImprovementRequest();
  };

  $("btnSave").onclick = saveCurrent;
  $("btnCancel").onclick = closeEditor;
  $("btnRevert").onclick = revertToPrevious;

  $("btnClear").onclick = () => {
    source.value = "";
    $("search").value = "";
    $("searchResult").textContent = "";
    clearSearchHighlight();
    source.focus();
  };

  $("btnCopy").onclick = async () => {
    try{
      await navigator.clipboard.writeText(source.value);
      const btn = $("btnCopy");
      const old = btn.textContent;
      btn.textContent = "コピー済";
      setTimeout(() => btn.textContent = old, 1200);
    }catch(e){
      alert("コピーに失敗しました");
    }
  };

  $("editorOverlay").addEventListener("click", e => {
    if(e.target === $("editorOverlay")) closeEditor();
  });
  $("pickerOverlay").addEventListener("click", e => {
    if(e.target === $("pickerOverlay")) closePicker();
  });

  $("stage").addEventListener("click", handleOutsideTap);
  $("toolbar").addEventListener("click", e => {
    if(e.target.closest("button")) return;
    handleOutsideTap();
  });

  $("search").addEventListener("input", () => { searchIndex = -1; runSearch("none"); });
  $("search").addEventListener("keydown", e => {
    if(e.key === "Enter"){ e.preventDefault(); runSearch("next"); }
  });
  $("btnSearchNext").onclick = () => runSearch("next");
  $("btnSearchPrev").onclick = () => runSearch("prev");

  let kbdTimer = null;
  function adjustOverlaysForKeyboard(){
    if(!window.visualViewport) return;
    clearTimeout(kbdTimer);
    kbdTimer = setTimeout(() => {
      const vv = window.visualViewport;
      const kb = Math.max(0, window.innerHeight - vv.height - (vv.offsetTop || 0));
      const pad = kb > 0 ? Math.min(kb, window.innerHeight * 0.7) + "px" : "";
      [$("editorOverlay"), $("memoOverlay")].forEach(ov => {
        if(!ov) return;
        if(!ov.classList.contains("show")){ ov.style.paddingBottom = ""; return; }
        ov.style.paddingBottom = pad;
      });
    }, 60);
  }
  window.visualViewport?.addEventListener("resize", adjustOverlaysForKeyboard);

  // 初回起動
  syncAppHeight();
  load();
  setSidebar(sidebarOpen);
  render();
  setDevice("phone");
  updatePreview();
  updateExportBadge();

  requestAnimationFrame(() => {
    fitDevices();
    resizeAllPreviews();
  });
  setTimeout(relayout, 260);
  window.addEventListener("load", () => setTimeout(relayout, 100));
})();
</script>
